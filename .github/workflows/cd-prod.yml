name: CD — Production Deploy (prod branch)

on:
  push:
    branches: [prod]

jobs:
  prod-deploy:
    runs-on: [self-hosted, zimaos]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Create rollback snapshot
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          ROLLBACK_DIR="/DATA/AppData/nexus/rollbacks/${TIMESTAMP}"
          mkdir -p "$ROLLBACK_DIR"
          cp /DATA/AppData/nexus/src/*.py "$ROLLBACK_DIR/"
          cp /DATA/AppData/nexus/requirements.txt "$ROLLBACK_DIR/" 2>/dev/null || true
          # Keep last 5 rollbacks only
          ls -dt /DATA/AppData/nexus/rollbacks/*/ 2>/dev/null | tail -n +6 | xargs rm -rf
          echo "ROLLBACK_DIR=$ROLLBACK_DIR" >> "$GITHUB_ENV"

      - name: Deploy to production
        run: |
          cp nexus-hub/core/*.py /DATA/AppData/nexus/src/
          cp nexus-hub/core/requirements.txt /DATA/AppData/nexus/

      - name: Restart container
        run: docker restart nexus-mcp

      - name: Smoke test
        id: smoke
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -sf http://192.168.1.186:8900/health 2>/dev/null | python3 -c \
              "import sys,json; d=sys.stdin.read(); print(json.loads(d).get('status','') if d else '')" \
              2>/dev/null) || true
            if [ "$STATUS" = "ok" ]; then echo "Smoke test passed after $i attempt(s)"; exit 0; fi
            echo "Attempt $i: not ready, waiting 3s..."
            sleep 3
          done
          echo "SMOKE_FAILED=true" >> "$GITHUB_ENV"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rolling back to $ROLLBACK_DIR"
          cp "$ROLLBACK_DIR"/*.py /DATA/AppData/nexus/src/
          docker restart nexus-mcp
          echo "Rollback complete"

      - name: Verify MCP endpoint
        if: success()
        run: |
          curl -sf -X POST http://192.168.1.186:8900/mcp \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"tools/list","id":1}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'result' in d, 'MCP broken'" \
            && echo "MCP endpoint verified"

      - name: Write deploy info to memory
        if: success()
        run: |
          curl -sf -X PUT http://192.168.1.186:8900/api/memory/last-deploy \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"branch: prod\ncommit: ${{ github.sha }}\ndeployed_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)\nstatus: success\nenvironment: production\"}" || true

  backup-memory:
    runs-on: [self-hosted, zimaos]
    needs: prod-deploy
    if: success()
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BACKUP_GITHUB_TOKEN }}
          ref: prod
          fetch-depth: 1

      - name: Sync memory and skills
        run: |
          rsync -av /DATA/AppData/nexus/src/data/memory/ data/memory/ 2>/dev/null || true
          rsync -av /DATA/AppData/nexus/src/data/skills/ data/skills/ \
            --exclude="*.tmp" --max-size=500k 2>/dev/null || true

      - name: Commit backup
        run: |
          git config user.email "nexus-bot@evatechnosoft"
          git config user.name "Nexus CI Bot"
          git add data/memory/ data/skills/
          git diff --cached --quiet || \
            git commit -m "backup(prod): memory+skills [${GITHUB_SHA:0:8}] $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin prod
