<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Master Hub Portal v3.1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #020617;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --neon-blue: #38bdf8;
            --neon-green: #10b981;
            --neon-purple: #8b5cf6;
            --border: rgba(255,255,255,0.08);
        }

        body {
            background: var(--bg);
            color: #f8fafc;
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- SİDEBAR --- */
        .sidebar {
            width: 280px;
            height: 100vh;
            background: rgba(1, 2, 6, 0.95);
            border-right: 1px solid var(--border);
            position: fixed;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .main-content { margin-left: 280px; padding: 2rem; }

        /* --- SATELLITE CARDS --- */
        .sat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .sat-card:hover {
            border-color: var(--neon-blue);
            transform: translateY(-5px);
            background: rgba(30, 41, 59, 0.6);
        }

        .sat-card.active { border-left: 4px solid var(--neon-green); }

        .indicator {
            width: 12px; height: 12px; border-radius: 50%;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        .on { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
        .off { background: #475569; }

        /* --- DASHBOARD ELEMENTS --- */
        .doctor-box {
            background: #000;
            border-radius: 12px;
            padding: 1rem;
            font-family: 'Consolas', monospace;
            font-size: 0.8rem;
            color: #94a3b8;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        .btn-ignite {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 800;
            letter-spacing: 2px;
            transition: all 0.3s;
        }
        .btn-ignite:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .log-line { border-left: 2px solid var(--border); padding-left: 10px; margin-bottom: 5px; font-size: 0.75rem; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="h4 fw-black text-white" style="letter-spacing: 4px;">NEXUS HUB</div>
        <div class="text-muted small">v3.1 Final Core</div>
        <hr class="opacity-10">
        
        <nav class="nav flex-column gap-2">
            <a class="nav-link text-white active" href="#"><i class="fas fa-th-large me-2"></i> Dashboard</a>
            <a class="nav-link text-muted" href="#"><i class="fas fa-stethoscope me-2"></i> System Doctor</a>
            <a class="nav-link text-muted" href="#"><i class="fas fa-terminal me-2"></i> Log Viewer</a>
            <a class="nav-link text-muted" href="#"><i class="fas fa-vault me-2"></i> Vault Manager</a>
        </nav>

        <div class="mt-auto">
            <button class="btn btn-ignite w-100" onclick="ignite()">
                <i class="fas fa-bolt me-2"></i> IGNITE HUB
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2 class="fw-bold"><i class="fas fa-satellite-dish me-3 text-info"></i> Master Satellite Control</h2>
            <div id="status-badge" class="badge bg-success rounded-pill p-2 px-3">System Healthy</div>
        </div>

        <!-- SATELLITE GRID -->
        <div id="sat-grid" class="row g-4 mb-5">
            <!-- JS will inject cards here -->
        </div>

        <div class="row">
            <!-- DOCTOR REPORT -->
            <div class="col-md-6">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">System Health (Doctor)</h5>
                    <button class="btn btn-sm btn-outline-info" onclick="runDoctor()">Run Checkup</button>
                </div>
                <div class="doctor-box" id="doctor-report">
                    Scanning system integrity...
                </div>
            </div>

            <!-- ZIMAOS COMMAND CENTER -->
            <div class="col-md-6">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0 text-warning"><i class="fas fa-server me-2"></i> ZimaOS Command Center</h5>
                    <span class="badge bg-dark border border-warning text-warning small">192.168.1.186</span>
                </div>
                <div class="input-group mb-2">
                    <span class="input-group-text bg-dark border-secondary text-warning small">dean@zimaos:~$</span>
                    <input type="text" id="zima-cmd" class="form-control bg-dark text-white border-secondary small" placeholder="Enter remote command...">
                    <button class="btn btn-warning btn-sm px-3" onclick="execZima()"><i class="fas fa-paper-plane"></i></button>
                </div>
                <div class="doctor-box" id="zima-output" style="color: #fbbf24; height: 320px;">
                    Remote console ready.
                </div>
            </div>
        </div>
    </div>

    <script>
        async function execZima() {
            const cmd = document.getElementById('zima-cmd').value;
            if(!cmd) return;
            const output = document.getElementById('zima-output');
            output.innerText += `\n> ${cmd}\nExecuting...`;
            
            try {
                const r = await fetch('/api/zimaos/exec', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: cmd })
                });
                const data = await r.json();
                output.innerText += `\n${data.stdout}${data.stderr}`;
                output.scrollTop = output.scrollHeight;
                document.getElementById('zima-cmd').value = '';
            } catch (e) { output.innerText += `\nError: ${e}`; }
        }
        async function loadSatellites() {
            const r = await fetch('/api/satellites');
            const data = await r.json();
            const grid = document.getElementById('sat-grid');
            grid.innerHTML = '';

            Object.entries(data).forEach(([name, info]) => {
                const col = document.createElement('div');
                col.className = 'col-md-4';
                col.innerHTML = `
                    <div class="sat-card ${info.enabled ? 'active' : ''}" onclick="toggleSatellite('${name}', ${!info.enabled})">
                        <div class="indicator ${info.enabled ? 'on' : 'off'}"></div>
                        <h5 class="fw-bold text-white mb-1">${name.replace('nexus-', '').toUpperCase()}</h5>
                        <p class="text-muted small mb-0">${info.role}</p>
                        <div class="mt-3 d-flex justify-content-between align-items-center">
                            <span class="badge bg-dark border border-secondary text-info">${info.port || 'Worker'}</span>
                            <i class="fas fa-cog opacity-25"></i>
                        </div>
                    </div>
                `;
                col.onclick = () => loadLogs(name); // Tıklandığında logları da çek
                grid.appendChild(col);
            });
        }

        async function toggleSatellite(name, enabled) {
            await fetch(`/api/satellites/toggle/${name}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled: enabled })
            });
            loadSatellites();
        }

        async function ignite() {
            const r = await fetch('/api/system/ignite', { method: 'POST' });
            alert('Ignition signal sent to Hub Core!');
        }

        async function runDoctor() {
            document.getElementById('doctor-report').innerText = 'Doctor is performing checkup...';
            const r = await fetch('/api/system/doctor');
            const data = await r.json();
            document.getElementById('doctor-report').innerText = data.output;
        }

        async function loadLogs(name) {
            const r = await fetch(`/api/system/logs/${name}`);
            const data = await r.json();
            document.getElementById('live-logs').innerText = data.logs;
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadSatellites();
            runDoctor();
            setInterval(loadSatellites, 5000);
        });
    </script>
</body>
</html>
