name: CD — Integration Tests (test branch)

on:
  push:
    branches: [test]

jobs:
  deploy-and-test:
    runs-on: [self-hosted, zimaos]
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Deploy src to ZimaOS
        run: |
          mkdir -p /DATA/AppData/nexus/src/templates
          cp nexus-hub/core/* /DATA/AppData/nexus/src/
          cp -r nexus-hub/templates/* /DATA/AppData/nexus/src/templates/
          cp nexus-hub/core/requirements.txt /DATA/AppData/nexus/

      - name: Restart Nexus container
        run: docker restart nexus-mcp

      - name: Wait for health
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -sf http://192.168.1.186:8900/health 2>/dev/null | python3 -c \
              "import sys,json; d=sys.stdin.read(); print(json.loads(d).get('status','') if d else '')" \
              2>/dev/null) || true
            if [ "$STATUS" = "ok" ]; then echo "Healthy after $i attempt(s)"; exit 0; fi
            echo "Attempt $i: not ready yet, waiting 3s..."
            sleep 3
          done
          echo "ERROR: Server did not become healthy after 60s" && exit 1

      - name: Install test deps
        run: pip3 install pytest httpx --quiet --user

      - name: Warm up embedding model
        run: |
          curl -sf "http://192.168.1.186:8900/api/search/hybrid?q=warmup&top_k=1&use_vector=false" || true
          sleep 3

      - name: Run integration tests (50 tests)
        env:
          NEXUS_BASE_URL: "http://192.168.1.186:8900"
          NEXUS_TIMEOUT: "60.0"
        run: |
          python3 -m pytest tests/ -v --tb=long \
            --junitxml=/tmp/nexus-test-results.xml -x

      - name: Run Nexus Doctor (Update Health Metrics)
        if: success()
        run: |
          export NEXUS_HUB_URL=http://192.168.1.186:8900
          python3 /DATA/AppData/nexus/src/nexus-hub/scripts/nexus-doctor.py

      - name: Write deploy info to memory
        if: success()
        run: |
          curl -sf -X PUT http://192.168.1.186:8900/api/memory/last-deploy \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"branch: test\ncommit: ${{ github.sha }}\ndeployed_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)\nstatus: success\nenvironment: test\"}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-${{ github.sha }}
          path: /tmp/nexus-test-results.xml

  backup-memory:
    runs-on: [self-hosted, zimaos]
    needs: deploy-and-test
    if: success()
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BACKUP_GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Sync memory and skills from ZimaOS
        run: |
          rsync -av /DATA/AppData/nexus/src/data/memory/ data/memory/ 2>/dev/null || true
          rsync -av /DATA/AppData/nexus/src/data/skills/ data/skills/ \
            --exclude="*.tmp" --max-size=500k 2>/dev/null || true

      - name: Commit and push backup
        run: |
          git config user.email "nexus-bot@evatechnosoft"
          git config user.name "Nexus CI Bot"
          git add data/memory/ data/skills/
          git diff --cached --quiet || \
            git commit -m "backup(test): memory+skills [${GITHUB_SHA:0:8}] $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin test
