<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Hub Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.05);
            --neon-blue: #38bdf8;
            --neon-purple: #a855f7;
            --neon-green: #22c55e;
            --neon-red: #ef4444;
        }

        body {
            background: #010409;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
        }

        /* --- SATELLITE ADMIN BANNER --- */
        .admin-banner {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            padding: 0.8rem 2rem;
            display: flex;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .sat-pill {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
            user-select: none;
        }

        .sat-pill:hover {
            border-color: var(--neon-blue);
            background: rgba(255,255,255,0.08);
        }

        .sat-pill.active {
            border-color: var(--neon-green);
            background: rgba(34, 197, 94, 0.1);
        }

        .sat-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transition: all 0.4s ease;
        }

        .sat-on { background: var(--neon-green); box-shadow: 0 0 12px var(--neon-green); }
        .sat-off { background: #475569; }

        .sat-label {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #94a3b8;
        }

        .sat-pill.active .sat-label { color: #f1f5f9; }

        /* --- MAIN CONTENT AREA --- */
        .curator-arena {
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr 1.5fr;
            gap: 20px;
            height: calc(100vh - 70px);
        }

        .nexus-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .panel-title {
            font-weight: 900;
            letter-spacing: 2px;
            font-size: 0.8rem;
            color: var(--neon-blue);
            text-transform: uppercase;
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .scroll-area::-webkit-scrollbar { width: 4px; }
        .scroll-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        /* --- CARDS --- */
        .item-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .item-card:hover {
            background: rgba(255,255,255,0.05);
            border-color: var(--neon-blue);
            transform: translateX(5px);
        }

        .btn-nexus {
            font-size: 0.65rem;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            transition: all 0.2s;
        }

        .btn-blue { background: var(--neon-blue); color: #010409; }
        .btn-purple { background: var(--neon-purple); color: white; }
        .btn-green { background: var(--neon-green); color: #010409; }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 4, 9, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loading">
        <div class="spinner-border text-info mb-3" style="width: 3rem; height: 3rem;"></div>
        <div class="h5 fw-light" id="loading-text">Intelligence Processing...</div>
    </div>

    <!-- SATELLITE ADMIN PANEL -->
    <div class="admin-banner" id="sat-banner">
        <div style="font-weight: 900; font-size: 0.9rem; letter-spacing: 3px; color: var(--neon-blue); margin-right: 20px; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 25px;">
            NEXUS HUB <span style="color: white; font-weight: 200;">v3.1</span>
        </div>
        <div id="sat-list" class="d-flex gap-3 align-items-center">
            <!-- Satellites will be injected here -->
            <span class="text-muted small">Scanning satellites...</span>
        </div>
    </div>

    <div class="curator-arena">
        
        <!-- PANEL 1: RAW DRAFTS -->
        <div class="nexus-panel">
            <div class="panel-header">
                <div class="panel-title"><i class="fas fa-satellite me-2"></i> Raw Drafts</div>
                <button class="btn btn-sm btn-outline-info border-0" onclick="loadDrafts()"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div id="drafts-list" class="scroll-area">
                <!-- Data here -->
            </div>
        </div>

        <!-- PANEL 2: AI PIPELINE -->
        <div class="nexus-panel">
            <div class="panel-header">
                <div class="panel-title"><i class="fas fa-brain me-2"></i> AI Processed</div>
                <button class="btn btn-sm btn-outline-info border-0" onclick="loadProcessed()"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div id="processed-list" class="scroll-area">
                <!-- Data here -->
            </div>
        </div>

        <!-- PANEL 3: INTELLIGENCE PREVIEW -->
        <div class="nexus-panel">
            <div class="panel-header">
                <div class="panel-title"><i class="fas fa-eye me-2"></i> Intelligence Preview</div>
            </div>
            <div id="preview-content" class="scroll-area p-2">
                <div class="text-center text-muted mt-5">
                    <i class="fas fa-fingerprint fa-3x mb-3 opacity-25"></i>
                    <p>Select an item to view intelligence data</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- SATELLITE LOGIC ---
        async function loadSatellites() {
            try {
                const r = await fetch('/api/satellites');
                const data = await r.json();
                const container = document.getElementById('sat-list');
                container.innerHTML = '';

                Object.entries(data).forEach(([name, info]) => {
                    const pill = document.createElement('div');
                    pill.className = `sat-pill ${info.enabled ? 'active' : ''}`;
                    pill.onclick = () => toggleSatellite(name, !info.enabled);
                    pill.innerHTML = `
                        <div class="sat-indicator ${info.enabled ? 'sat-on' : 'sat-off'}"></div>
                        <div class="sat-label">${name.replace('nexus-', '').toUpperCase()}</div>
                    `;
                    container.appendChild(pill);
                });
            } catch (e) { console.error("Sat Error:", e); }
        }

        async function toggleSatellite(name, enabled) {
            try {
                await fetch(`/api/satellites/toggle/${name}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled: enabled })
                });
                loadSatellites();
            } catch (e) { console.error("Toggle Error:", e); }
        }

        // --- CONTENT LOGIC ---
        async function loadDrafts() {
            const r = await fetch('/api/drafts');
            const data = await r.json();
            const list = document.getElementById('drafts-list');
            list.innerHTML = data.map(f => `
                <div class="item-card d-flex justify-content-between align-items-center">
                    <div class="small fw-bold text-truncate me-2">${f}</div>
                    <button class="btn-nexus btn-purple" onclick="processDraft('${f}')">Process</button>
                </div>
            `).join('');
        }

        async function loadProcessed() {
            const r = await fetch('/api/processed');
            const data = await r.json();
            const list = document.getElementById('processed-list');
            list.innerHTML = data.map(f => `
                <div class="item-card">
                    <div class="small fw-bold text-success mb-2">${f}</div>
                    <div class="d-flex gap-2">
                        <button class="btn-nexus btn-blue" style="flex:1" onclick="previewFile('${f}')">View</button>
                        <button class="btn-nexus btn-green" style="flex:2" onclick="approveDraft('${f}')">Seal to Nexus</button>
                    </div>
                </div>
            `).join('');
        }

        async function processDraft(filename) {
            const overlay = document.getElementById('loading');
            overlay.style.display = 'flex';
            try {
                await fetch(`/api/process/${filename}`, { method: 'POST' });
                loadDrafts(); loadProcessed();
            } finally { overlay.style.display = 'none'; }
        }

        async function previewFile(filename) {
            const r = await fetch(`/api/processed-view/${filename}`);
            const data = await r.json();
            document.getElementById('preview-content').innerHTML = `
                <div class="bg-dark p-4 rounded-4 border border-secondary">
                    <pre style="white-space: pre-wrap; font-family: 'Consolas', monospace; font-size: 0.85rem; color: #facc15;">${data.content}</pre>
                </div>
            `;
        }

        async function approveDraft(filename) {
            if (!confirm('Seal to Nexus Hub Core?')) return;
            await fetch(`/api/approve/${filename}`, { method: 'POST' });
            loadProcessed();
        }

        // Initial Load
        document.addEventListener('DOMContentLoaded', () => {
            loadSatellites();
            loadDrafts();
            loadProcessed();
            setInterval(loadSatellites, 5000); // Sync status every 5s
        });
    </script>
</body>
</html>
