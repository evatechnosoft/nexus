name: CD — Production Deploy (prod branch)

on:
  push:
    branches: [prod]

jobs:
  prod-deploy:
    runs-on: [self-hosted, zimaos]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Snapshot rollback
        run: |
          docker commit {{PROJECT_SLUG}} {{PROJECT_SLUG}}:rollback 2>/dev/null || true

      - name: Stop old container
        run: docker stop {{PROJECT_SLUG}} 2>/dev/null || true

      - name: Remove old container
        run: docker rm {{PROJECT_SLUG}} 2>/dev/null || true

      - name: Build image
        run: docker build -t {{PROJECT_SLUG}}:latest .

      - name: Start container
        run: |
          docker run -d \
            --name {{PROJECT_SLUG}} \
            --restart unless-stopped \
            -p {{PROD_PORT}}:{{CONTAINER_PORT}} \
            -v /DATA/AppData/{{PROJECT_SLUG}}/data:/app/data \
            -e {{DATA_DIR_ENV}}=/app/data \
            {{PROJECT_SLUG}}:latest

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -sf http://{{ZIMAOS_IP}}:{{PROD_PORT}}/health 2>/dev/null | python3 -c \
              "import sys,json; d=sys.stdin.read(); print(json.loads(d).get('status','') if d else '')" \
              2>/dev/null) || true
            if [ "$STATUS" = "ok" ]; then echo "Healthy after $i attempt(s)"; exit 0; fi
            echo "Attempt $i: not ready, waiting 3s..."
            sleep 3
          done
          echo "Smoke test failed — rolling back"
          docker stop {{PROJECT_SLUG}} || true
          docker rm {{PROJECT_SLUG}} || true
          docker run -d --name {{PROJECT_SLUG}} --restart unless-stopped \
            -p {{PROD_PORT}}:{{CONTAINER_PORT}} \
            -v /DATA/AppData/{{PROJECT_SLUG}}/data:/app/data \
            {{PROJECT_SLUG}}:rollback || true
          exit 1

  docker-publish:
    needs: prod-deploy
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/{{DOCKERHUB_IMAGE}}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/{{DOCKERHUB_IMAGE}}:${{ github.sha }}

      - name: Export tar for offline
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/{{DOCKERHUB_IMAGE}}:latest
          docker save ${{ secrets.DOCKERHUB_USERNAME }}/{{DOCKERHUB_IMAGE}}:latest | gzip > {{DOCKERHUB_IMAGE}}.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: prod-${{ github.sha }}
          name: "{{PROJECT_NAME}} — ${{ github.run_number }}"
          body: |
            ## {{PROJECT_NAME}}

            ### Online install
            ```bash
            curl -fsSL https://raw.githubusercontent.com/{{GITHUB_OWNER}}/{{GITHUB_REPO}}/prod/setup.sh | bash
            ```

            ### Offline install
            1. Download `{{DOCKERHUB_IMAGE}}.tar.gz`
            2. `./setup.sh --offline {{DOCKERHUB_IMAGE}}.tar.gz`

            ### Docker Hub
            ```bash
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/{{DOCKERHUB_IMAGE}}:latest
            ```
          files: |
            {{DOCKERHUB_IMAGE}}.tar.gz
            setup.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backup-memory:
    needs: prod-deploy
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.BACKUP_GITHUB_TOKEN }}

      - name: Commit backup
        run: |
          git config user.email "ci-bot@evatechnosoft"
          git config user.name "CI Bot"
          git add data/memory/ data/skills/ 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "backup(prod): memory+skills [${GITHUB_SHA:0:8}] $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin prod
