name: CI — Lint + Unit Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, test]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r nexus-hub/core/requirements-dev.txt

      - name: Ruff lint
        run: ruff check nexus-hub/core/ tests/

      - name: Ruff format check
        run: ruff format --check nexus-hub/core/ tests/

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r nexus-hub/core/requirements.txt
          pip install -r nexus-hub/core/requirements-dev.txt

      - name: Prepare mock data dir
        run: |
          mkdir -p /tmp/nexus-test/memory /tmp/nexus-test/skills

      - name: Start mock Nexus server
        run: |
          NEXUS_DATA_DIR=/tmp/nexus-test \
          uvicorn nexus_hub.core.nexus_mcp_server:app \
            --app-dir . --host 127.0.0.1 --port 8900 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8900/health && break
            sleep 1
          done

      - name: Run tests (mock mode)
        env:
          NEXUS_BASE_URL: "http://127.0.0.1:8900"
        run: pytest tests/ -v --tb=short -x

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.sha }}
          path: .pytest_cache/
