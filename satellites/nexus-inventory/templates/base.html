<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}IT Envanter{% endblock %}</title>
  
  <!-- Fonts: Outfit (Modern & Premium) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  
  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Style -->
  <link rel="stylesheet" href="/static/style.css">
  
  <style>
    :root {
      --font-family: 'Outfit', sans-serif;
    }
    body {
      font-family: var(--font-family);
    }
  </style>
</head>
<body class="bg-dark text-white">

<!-- Glow Effects -->
<div class="bg-glow"></div>
<div class="bg-glow" style="top: 60%; left: 70%; width: 500px; height: 500px; opacity: 0.15; background: radial-gradient(circle, var(--secondary) 0%, transparent 70%);"></div>

<nav class="navbar navbar-expand-lg border-bottom border-secondary border-opacity-25 sticky-top bg-glass py-3">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-extrabold d-flex align-items-center gap-2" href="/" style="letter-spacing: -1px;">
      <div class="bg-primary rounded-pill shadow-lg d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
        <i class="bi bi-cpu text-white fs-6"></i>
      </div>
      <span>DEAN<span class="text-primary">OS</span> <span class="fw-light opacity-50">Inventory</span></span>
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="bi bi-list fs-2 text-white"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link px-3" href="/"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="/requests/"><i class="bi bi-envelope-paper me-2"></i>Talepler</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="/requests/email-queue"><i class="bi bi-mailbox me-2"></i>E-posta Kuyruğu</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="/inventory/"><i class="bi bi-box-seam me-2"></i>Envanter</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="/assignments/"><i class="bi bi-send-check me-2"></i>Atamalar</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle px-3" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-file-earmark-spreadsheet me-1"></i>Excel
          </a>
          <ul class="dropdown-menu dropdown-menu-end border shadow-lg mt-2 py-2" 
              style="z-index: 2000; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.1) !important; border-radius: 14px;">
            <li><a class="dropdown-item py-2" href="/excel/export"><i class="bi bi-download me-2 text-primary"></i>Dışa Aktar</a></li>
            <li><a class="dropdown-item py-2" href="/excel/import-page"><i class="bi bi-upload me-2 text-info"></i>İçe Aktar</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid py-4 px-4">
  {% block content %}{% endblock %}
</div>

<!-- Environment Badge -->
{% if APP_ENV %}
<div class="fixed-top d-flex justify-content-end p-3" style="z-index: 2000; pointer-events: none;">
  <span class="badge border shadow-lg px-3 py-2 d-flex align-items-center gap-2" 
        style="pointer-events: auto; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); border-radius: 12px; font-weight: 800; letter-spacing: 1px; font-size: 0.65rem;
               {% if APP_ENV == 'PROD' %} border-color: #10b981 !important; color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
               {% elif APP_ENV == 'TEST' %} border-color: #f59e0b !important; color: #f59e0b; box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
               {% else %} border-color: #38bdf8 !important; color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); {% endif %}">
    <span class="rounded-circle" style="width: 8px; height: 8px; 
          {% if APP_ENV == 'PROD' %} background: #10b981; 
          {% elif APP_ENV == 'TEST' %} background: #f59e0b; 
          {% else %} background: #38bdf8; {% endif %}"></span>
    {{ APP_ENV }}
  </span>
</div>
{% endif %}

<!-- Modal Block for correctly stacking modals -->
{% block modals %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
