name: CD — Integration Tests (test branch)

on:
  push:
    branches: [test]

jobs:
  deploy-and-test:
    runs-on: self-hosted
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Sync Repository to ZimaOS (Hierarchical)
        run: |
          # Sunucuda ana dizini hazırla
          mkdir -p /DATA/AppData/nexus
          # Klasörleri hiyerarşik olarak kopyala (Mirror)
          cp -r core /DATA/AppData/nexus/
          cp -r scripts /DATA/AppData/nexus/
          cp -r data /DATA/AppData/nexus/
          cp -r templates /DATA/AppData/nexus/
          cp Dockerfile /DATA/AppData/nexus/
          cp requirements.txt /DATA/AppData/nexus/ 2>/dev/null || cp core/requirements.txt /DATA/AppData/nexus/

      - name: Restart Nexus container
        run: docker restart nexus-mcp

      - name: Wait for health
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -sf http://192.168.1.186:8900/health 2>/dev/null | python3 -c \
              "import sys,json; d=sys.stdin.read(); print(json.loads(d).get('status','') if d else '')" \
              2>/dev/null) || true
            if [ "$STATUS" = "ok" ]; then echo "Healthy after $i attempt(s)"; exit 0; fi
            echo "Attempt $i: not ready yet, waiting 3s..."
            sleep 3
          done
          echo "ERROR: Server did not become healthy after 60s" && exit 1

      - name: Run v3.1 Integration Tests
        env:
          NEXUS_BASE_URL: "http://192.168.1.186:8900"
        run: |
          # Repo yapısıyla aynı yerdeki scripti çalıştır
          python3 /DATA/AppData/nexus/core/build_skill_index.py
          python3 /DATA/AppData/nexus/scripts/nexus-dream.py --light
          python3 -m pytest tests/ -v --tb=short

      - name: Write deploy info to memory
        if: success()
        run: |
          curl -sf -X PUT http://192.168.1.186:8900/api/memory/last-deploy \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"branch: test\ncommit: ${{ github.sha }}\nstatus: success\nhierarchy: v3-standard\"}"
