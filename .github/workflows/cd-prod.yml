name: CD — Production Deploy (prod branch)

on:
  push:
    branches: [prod]

jobs:
  prod-deploy:
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync Repository to ZimaOS (Hierarchical)
        run: |
          mkdir -p /DATA/AppData/nexus
          # Hiyerarşiyi bozmadan kopyala
          cp -r core /DATA/AppData/nexus/
          cp -r scripts /DATA/AppData/nexus/
          cp -r data /DATA/AppData/nexus/
          cp -r templates /DATA/AppData/nexus/
          cp Dockerfile /DATA/AppData/nexus/
          cp requirements.txt /DATA/AppData/nexus/ 2>/dev/null || cp core/requirements.txt /DATA/AppData/nexus/

      - name: Restart container
        run: docker restart nexus-mcp

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -sf http://192.168.1.186:8900/health 2>/dev/null | python3 -c \
              "import sys,json; d=sys.stdin.read(); print(json.loads(d).get('status','') if d else '')" \
              2>/dev/null) || true
            if [ "$STATUS" = "ok" ]; then 
              # Yeni Indexer'ı tetikle
              python3 /DATA/AppData/nexus/core/build_skill_index.py
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Write deploy info to memory
        if: success()
        run: |
          curl -sf -X PUT http://192.168.1.186:8900/api/memory/last-deploy \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"branch: prod\ncommit: ${{ github.sha }}\nstatus: success\nenvironment: production\nhierarchy: v3-standard\"}"
