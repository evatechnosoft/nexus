<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Master Hub Portal v3.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #020617;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --neon-blue: #38bdf8;
            --neon-green: #10b981;
            --neon-purple: #8b5cf6;
            --border: rgba(255,255,255,0.08);
        }

        body {
            background: var(--bg);
            color: #f8fafc;
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .sidebar {
            width: 280px;
            height: 100vh;
            background: rgba(1, 2, 6, 0.95);
            border-right: 1px solid var(--border);
            position: fixed;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .main-content { margin-left: 280px; padding: 2rem; }

        .sat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.2rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .sat-card:hover {
            border-color: var(--neon-blue);
            transform: translateY(-3px);
            background: rgba(30, 41, 59, 0.6);
        }

        .sat-card.active { border-left: 4px solid var(--neon-green); }

        .indicator {
            width: 10px; height: 10px; border-radius: 50%;
            margin-bottom: 8px;
        }
        .on { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
        .off { background: #475569; }

        .doctor-box {
            background: #000;
            border-radius: 12px;
            padding: 1rem;
            font-family: 'Consolas', monospace;
            font-size: 0.75rem;
            color: #94a3b8;
            overflow-y: auto;
            border: 1px solid var(--border);
            white-space: pre-wrap;
        }

        .btn-ignite {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 800;
            letter-spacing: 2px;
            transition: all 0.3s;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="h4 fw-black text-white" style="letter-spacing: 4px;">NEXUS HUB</div>
        <div class="text-muted small">v3.2 Master Core</div>
        <hr class="opacity-10">
        
        <nav class="nav flex-column gap-2">
            <a class="nav-link text-white active" href="#"><i class="fas fa-th-large me-2"></i> Dashboard</a>
            <a class="nav-link text-muted" href="/intelligence" target="_blank"><i class="fas fa-brain me-2"></i> Tiasmam Reports</a>
            <a class="nav-link text-muted" href="#"><i class="fas fa-stethoscope me-2"></i> Health</a>
            <a class="nav-link text-muted" href="#"><i class="fas fa-terminal me-2"></i> Console</a>
        </nav>

        <div class="mt-auto">
            <button class="btn btn-ignite w-100" onclick="ignite()">
                <i class="fas fa-bolt me-2"></i> IGNITE HUB
            </button>
        </div>
    </div>

    <div class="main-content">
        <h2 class="fw-bold mb-4"><i class="fas fa-satellite-dish me-3 text-info"></i> Master Control</h2>

        <!-- SATELLITE GRID -->
        <div id="sat-grid" class="row g-3 mb-5">
            <!-- JS Inject -->
        </div>

        <div class="row g-4">
            <!-- 1. HEALTH -->
            <div class="col-md-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold mb-0 text-info">SYSTEM HEALTH</h6>
                    <button class="btn btn-sm btn-outline-info border-0" onclick="runDoctor()"><i class="fas fa-sync"></i></button>
                </div>
                <div class="doctor-box" id="doctor-report" style="height: 400px;">
                    Scanning...
                </div>
            </div>

            <!-- 2. LOGS -->
            <div class="col-md-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold mb-0 text-success">SATELLITE LOGS: <span id="active-log-name">-</span></h6>
                </div>
                <div class="doctor-box" id="live-logs" style="color: #10b981; height: 400px;">
                    Select satellite for logs.
                </div>
            </div>

            <!-- 3. ZIMAOS -->
            <div class="col-md-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold mb-0 text-warning">ZIMAOS BRIDGE</h6>
                    <span class="badge bg-dark border border-warning text-warning small">192.168.1.186</span>
                </div>
                <input type="text" id="zima-cmd" class="form-control bg-dark text-white border-secondary small mb-2" placeholder="Command + Enter">
                <div class="doctor-box" id="zima-output" style="color: #fbbf24; height: 358px;">
                    Remote ready.
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadSatellites() {
            try {
                const r = await fetch('/api/satellites');
                const data = await r.json();
                const grid = document.getElementById('sat-grid');
                grid.innerHTML = '';

                Object.entries(data).forEach(([name, info]) => {
                    const col = document.createElement('div');
                    col.className = 'col-md-4';
                    col.innerHTML = `
                        <div class="sat-card ${info.enabled ? 'active' : ''}" onclick="loadLogs('${name}')">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div class="indicator ${info.enabled ? 'on' : 'off'}"></div>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" ${info.enabled ? 'checked' : ''} 
                                        onclick="event.stopPropagation(); toggleSatellite('${name}', this.checked)">
                                </div>
                            </div>
                            <h6 class="fw-bold text-white mb-1">${name.replace('nexus-', '').toUpperCase()}</h6>
                            <p class="text-muted small mb-0" style="font-size: 0.65rem;">${info.role}</p>
                        </div>
                    `;
                    grid.appendChild(col);
                });
            } catch (e) { console.error(e); }
        }

        async function toggleSatellite(name, enabled) {
            await fetch(`/api/satellites/toggle/${name}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled: enabled })
            });
            loadSatellites();
        }

        async function loadLogs(name) {
            document.getElementById('active-log-name').innerText = name.toUpperCase();
            const r = await fetch(`/api/system/logs/${name}`);
            const data = await r.json();
            const logBox = document.getElementById('live-logs');
            logBox.innerText = data.logs;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function execZima() {
            const input = document.getElementById('zima-cmd');
            const cmd = input.value;
            if(!cmd) return;
            const output = document.getElementById('zima-output');
            output.innerText += `\n$ ${cmd}\n`;
            
            const r = await fetch('/api/zimaos/exec', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: cmd })
            });
            const data = await r.json();
            output.innerText += `${data.stdout}${data.stderr}`;
            output.scrollTop = output.scrollHeight;
            input.value = '';
        }

        document.getElementById('zima-cmd').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') execZima();
        });

        async function runDoctor() {
            document.getElementById('doctor-report').innerText = 'Running...';
            const r = await fetch('/api/system/doctor');
            const data = await r.json();
            document.getElementById('doctor-report').innerText = data.output;
        }

        async function ignite() {
            await fetch('/api/system/ignite', { method: 'POST' });
            alert('Ignition Signal Sent!');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadSatellites();
            runDoctor();
            setInterval(loadSatellites, 5000);
        });
    </script>
</body>
</html>
